<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Communications Intelligence Platform</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand-block">
          <div class="brand-mark">CI</div>
          <div>
            <h1>Communications Intelligence</h1>
            <p>Airtable-powered analytics</p>
          </div>
        </div>
        <nav class="nav-tabs" aria-label="Primary pages">
          <button class="nav-tab active" data-page="overview" type="button">KPI Overview</button>
          <button class="nav-tab" data-page="content" type="button">Top Performing Content</button>
          <button class="nav-tab" data-page="channel-breakdown" type="button">Channel Breakdown</button>
        </nav>
        <div class="source-panel" id="source-panel"></div>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <div>
            <p class="eyebrow">Airtable Source Of Truth</p>
            <h2 id="page-title">KPI Overview</h2>
          </div>
          <div class="status-pill" id="api-status">Loading</div>
        </header>
        <section id="page-root" class="page-root" aria-live="polite"></section>
      </main>
    </div>
    <script src="/app.js" type="module"></script>
    <script src="/castos-card-ui.js" type="module"></script>
    <script>
      // Temporary UI feature gate. The legacy Content Trends implementation
      // remains in app.js for rollback while Content Trend Analysis is developed.
      const hideLegacyContentTrends = () => {
        document.querySelectorAll("#page-root section").forEach((section) => {
          const title = section.querySelector("h3.section-title");
          if (title && title.textContent.trim() === "Content Trends") {
            section.hidden = true;
            section.setAttribute("aria-hidden", "true");
            section.dataset.featureState = "deprecated";
          }
        });
      };

      const pageRoot = document.querySelector("#page-root");
      const legacyContentTrendsObserver = new MutationObserver(hideLegacyContentTrends);
      legacyContentTrendsObserver.observe(pageRoot, { childList: true, subtree: true });
      hideLegacyContentTrends();
    </script>
  </body>
</html>
